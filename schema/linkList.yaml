linkList:
  title: "リンクリスト"
  headerRow: 1
  dataStartRow: 2
  columns:
    id:
      type: number
      label: "ID"
      description: "管理用番号"
      required: true

    title:
      type: string
      label: "リンクタイトル"
      description: "リンクタイトル"
      required: true

    buttonImage:
      type: image
      label: "ボタンバナー画像"
      description: "リンクボタンに表示する画像 (未入力の場合デフォルト画像)"
      required: false
      default: "assets/link/defaultbutton_typeA.svg"
      source_type:
        enum:
          upload: "アップロード"
          select: "画像選択 (ライブラリ)"
        default: "upload"
      mediaLibrary: "assets/link"
      uploadPath: "assets/link"
      accept:
        - ".png"
        - ".jpg"
        - ".jpeg"

      storage:
        strategy: "accumulate"
        naming: "custom"
        allowCustomFilename: true
        placeholderFilename: "coconala_banner"
        namingRules:
          pattern: "^[a-zA-Z0-9_-]+$"
          errorMessage: "ファイル名は半角英数字、ハイフン(-)、アンダースコア(_)のみ使用可能です"
        onConflict: "prevent"

      validation:
        maxSizeBytes: 512000 # 500KB

      crop:
        enabled: true
        trigger: "uploadOnly"
        aspectRatio: "5:1"
        width: 500
        height: 100
        keepAspectRatio: true

    buttonTextColor:
      type: string
      label: "ボタン文字色"
      description: "ボタン文字色 (HEXカラーコード)"
      default: "#ffffff"
      required: false

    link:
      type: url
      label: "リンクURL"
      description: "リンクのURL"
      required: true

    priority:
      type: number
      label: "表示優先度"
      description: "表示優先度"
      min: 1
      required: true