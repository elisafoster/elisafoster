shop:
  title: "ショップリスト"
  headerRow: 1
  dataStartRow: 2
  columns:
    id:
      type: number
      description: "管理用番号"
      required: true

    name:
      type: string
      description: "商品名"
      required: true

    shopTag_id:
      type: string
      description: "商品区分"
      references:
        table: "shopTag"
        field: "id"
      required: true

    merchandiseImage:
      type: image
      label: "画像"
      description: "表示する画像の指定方法を選択してください"
      required: true

      # ---------------------------------------------
      # ラジオボタン切り替え定義
      # ---------------------------------------------
      inputMode:
        uiType: "radio"
        default: "library"
        options:
          - value: "library"
            label: "ライブラリから選択 / アップロード"
          - value: "url"
            label: "外部URL指定 (Googleドライブ等)"

      # ---------------------------------------------
      # 1. ライブラリ選択 / アップロード側の設定
      # (inputMode == 'library' のときに有効)
      # ---------------------------------------------
      libraryConfig:
        mediaLibrary: "assets/shop"
        uploadPath: "assets/shop"
        accept:
          - ".png"
          - ".jpg"
          - ".jpeg"
          - ".webp"
        storage:
          strategy: "accumulate"
          allowCustomFilename: true
          namingRules:
            pattern: "^[a-zA-Z0-9_-]+$"
            errorMessage: "半角英数字、ハイフン、アンダースコアのみ使用可能です"
          onConflict: "prevent"
        validation:
          maxSizeBytes: 2097152 # 2MB (2 * 1024 * 1024)
        clientProcess:
          maxLongEdge: 800     # 長辺800pxにリサイズ（縦横どちらも破綻なし）
          compressQuality: 0.85

      # ---------------------------------------------
      # 2. 直URL指定側の設定
      # (inputMode == 'url' のときに有効)
      # ---------------------------------------------
      urlConfig:
        placeholder: "https://drive.google.com/file/d/..."
        hint: "Googleドライブの共有URL、または画像の直接URLを入力してください"
        # ドライブURLが入力された場合に自動変換・正規化する設定
        autoConvertDriveUrl: true

      # ---------------------------------------------
      # 3. 共通の表示・フィッティング設定
      # (どちらで選んだ画像にも共通して適用)
      # ---------------------------------------------
      fitProcess:
        enabled: true
        aspectRatio: "4:3"     # 4:3固定
        displayMode: "contain"  # 枠内に全体を収める（見切れ防止）
        background: "transparent"
      
    price:
      type: number
      description: "価格"
      required: true

    priority:
      type: number
      description: "表示優先度"
      required: true

    # ショップページのリンク
    booth:
      type: url
      description: "boothの商品ページURL"
      required: false
      validation:
        # https://*.booth.pm/... または https://booth.pm/... を許容
        pattern: "^https:\\/\\/([a-zA-Z0-9_-]+\\.)?booth\\.pm\\/.*$"
        errorMessage: "BOOTHのURL（https://◯◯.booth.pm/...）を入力してください"

    base:
      type: url
      description: "baseの商品ページURL"
      required: false
      validation:
        # BASEの標準ドメイン（thebase.in, base.shop, official.ec 等）を許容
        pattern: "^https:\\/\\/([a-zA-Z0-9_-]+\\.)?(thebase\\.in|base\\.shop|official\\.ec)\\/.*$"
        errorMessage: "BASEのショップ・商品URLを入力してください"

    streamart:
      type: url
      description: "streamartの商品ページURL"
      required: false
      validation:
        # streamartのドメインを許容
        pattern: "^https:\\/\\/([a-zA-Z0-9_-]+\\.)?streamart\\.jp\\/.*$"
        errorMessage: "StreamArtのURLを入力してください"

    freeshop:
      type: url
      description: "任意の商品ページURL"
      required: false
      # validation（pattern）を指定しないことで、通常の有効なURLなら何でも入力可能