event:
  title: "イベントバナー"
  headerRow: 1
  dataStartRow: 2
  columns:
    id:
      type: number
      label: "ID"
      description: "管理番号"
      required: true

    banner:
      type: image
      label: "イベントバナー画像"
      description: "イベント告知用バナー"
      required: true

      # ---------------------------------------------
      # ラジオボタン切り替え定義
      # ---------------------------------------------
      inputMode:
        uiType: "radio"
        default: "library"
        options:
          - value: "library"
            label: "ライブラリから選択 / アップロード"
          - value: "url"
            label: "外部URL指定 (Googleドライブ等)"

      # ---------------------------------------------
      # 1. ライブラリ選択 / アップロード側の設定
      # (inputMode == 'library' のときに有効)
      # ---------------------------------------------
      libraryConfig:
        mediaLibrary: "assets/event"
        uploadPath: "assets/event"
        accept:
          - ".png"
          - ".jpg"
          - ".jpeg"
        storage:
          strategy: "accumulate"
          allowCustomFilename: true
          namingRules:
            pattern: "^[a-zA-Z0-9_-]+$"
            errorMessage: "半角英数字、ハイフン、アンダースコアのみ使用可能です"
          onConflict: "prevent"
        validation:
          maxSizeBytes: 2097152 # 2MB (2 * 1024 * 1024)
        clientProcess:
          maxLongEdge: 1500     # 長辺1500pxにリサイズ（縦横どちらも破綻なし）
          compressQuality: 0.85

      # ---------------------------------------------
      # 2. 直URL指定側の設定
      # (inputMode == 'url' のときに有効)
      # ---------------------------------------------
      urlConfig:
        placeholder: "https://drive.google.com/file/d/..."
        hint: "Googleドライブの共有URL、または画像の直接URLを入力してください"
        # ドライブURLが入力された場合に自動変換・正規化する設定
        autoConvertDriveUrl: true

      # ---------------------------------------------
      # 3. 共通の表示・フィッティング設定
      # (どちらで選んだ画像にも共通して適用)
      # ---------------------------------------------
      fitProcess:
        enabled: true
        aspectRatio: "3：1"     # 3:1固定
        displayMode: "contain"  # 枠内に全体を収める（見切れ防止）
        background: "transparent"

    link:
      type: url
      label: "リンクURL"
      description: "リンクのURL"
      required: false

    start_at:
      type: date
      description: "開始日時"
      format: "yyyy-mm-dd hh:mm:ss"
      required: true

    end_at:
      type: date
      description: "終了日時"
      format: "yyyy-mm-dd hh:mm:ss"
      required: true