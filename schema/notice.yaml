notice:
  title: "お知らせ"
  headerRow: 1
  dataStartRow: 2
  columns:
    id:
      type: number
      description: "管理番号"
      required: true

    created_at:
      type: datetime
      description: "送信時刻"
      default: "CURRENT_TIMESTAMP"

    scheduled_at:
      type: datetime
      description: "予約投稿時刻（未設定時は即時公開）"
      required: true
      default: null

    status:
      type: string
      description: "公開ステータス"
      enum:
        published: "公開"
        scheduled: "予約"
        draft: "下書き"
      default: "published"

    message:
      type: text
      description: "お知らせ本文"
      required: true

    Image:
      type: image
      label: "画像"
      description: "表示する画像の指定方法を選択してください"
      required: false

      # ---------------------------------------------
      # ラジオボタン切り替え定義
      # ---------------------------------------------
      inputMode:
        uiType: "radio"
        default: "library"
        options:
          - value: "library"
            label: "ライブラリから選択 / アップロード"
          - value: "url"
            label: "外部URL指定 (Googleドライブ等)"

      # ---------------------------------------------
      # 1. ライブラリ選択 / アップロード側の設定
      # (inputMode == 'library' のときに有効)
      # ---------------------------------------------
      libraryConfig:
        mediaLibrary: "assets/notice"
        uploadPath: "assets/notice"
        accept:
          - ".png"
          - ".jpg"
          - ".jpeg"
          - ".webp"
        storage:
          strategy: "accumulate"
          allowCustomFilename: true
          namingRules:
            pattern: "^[a-zA-Z0-9_-]+$"
            errorMessage: "半角英数字、ハイフン、アンダースコアのみ使用可能です"
          onConflict: "prevent"
        validation:
          maxSizeBytes: 2097152 # 2MB (2 * 1024 * 1024)
        clientProcess:
          maxLongEdge: 1280     # 長辺1280pxにリサイズ（縦横どちらも破綻なし）
          compressQuality: 0.85

      # ---------------------------------------------
      # 2. 直URL指定側の設定
      # (inputMode == 'url' のときに有効)
      # ---------------------------------------------
      urlConfig:
        placeholder: "https://drive.google.com/file/d/..."
        hint: "Googleドライブの共有URL、または画像の直接URLを入力してください"
        # ドライブURLが入力された場合に自動変換・正規化する設定
        autoConvertDriveUrl: true

      # ---------------------------------------------
      # 3. 共通の表示・フィッティング設定
      # (どちらで選んだ画像にも共通して適用)
      # ---------------------------------------------
      fitProcess:
        enabled: true
        aspectRatio: "16:9"     # 16:9固定
        displayMode: "contain"  # 枠内に全体を収める（見切れ防止）
        background: "transparent"